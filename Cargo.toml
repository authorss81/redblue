[package]
name = "redblue"
version = "0.2.0"
edition = "2021"
authors = ["Redblue Contributors"]
description = "A programming language as readable as plain English"
license = "MIT"
repository = "https://github.com/authorss81/redblue"
keywords = ["programming-language", "compiler"]
categories = ["compiler", "development-tools"]

[[bin]]
name = "rb"
path = "src/main.rs"

# `cdylib` is what makes the WebAssembly playground module: it is the crate type
# that emits a `.wasm` and exports every `#[no_mangle]` symbol the library
# defines, which is what `wasm/redblue.js` calls. Built with:
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown --lib
#
# writing `target/wasm32-unknown-unknown/release/redblue.wasm`. `rlib` is kept
# so the native `rb` binary and the test suite link exactly as they did.
[lib]
name = "redblue"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
regex = "1.10"
chrono = "0.4"
reqwest = { version = "0.11", features = ["blocking"] }
indexmap = "2"

[dev-dependencies]
regex = "1.10"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
